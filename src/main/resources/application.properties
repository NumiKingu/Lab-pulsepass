spring.application.name=pulsepass

spring.datasource.url=${PULSEPASS_DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
spring.datasource.username=${PULSEPASS_DB_USER:pulsepass}
spring.datasource.password=${PULSEPASS_DB_PASSWORD:pulsepass}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

pulsepass.security.jwt.issuer=${PULSEPASS_JWT_ISSUER:pulsepass-api}
pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64:}
pulsepass.security.jwt.access-token-ttl=${PULSEPASS_JWT_TTL:PT15M}
pulsepass.security.cors.allowed-origins=${PULSEPASS_CORS_ALLOWED_ORIGINS:}

